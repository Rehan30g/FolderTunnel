<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinTunnel</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>WinTunnel</h1>
        <p>File Explorer</p>
      </div>
      <span class="status">Aktif</span>
    </header>
    <section class="panel">
      <div class="navigation"><button class="icon-button" id="backButton" aria-label="Kembali ke folder induk" title="Folder induk" disabled><span data-icon="back"></span></button><button class="icon-button" id="refreshButton" aria-label="Muat ulang" title="Muat ulang"><span data-icon="refresh"></span></button><nav class="pathbar" aria-label="Lokasi folder">{{BREADCRUMB}}</nav></div>
      <div class="toolbar"><label class="search"><span data-icon="search"></span><input id="searchInput" type="search" placeholder="Cari di folder ini" aria-label="Cari di folder ini"></label><div class="view-controls" aria-label="Tampilan"><button class="icon-button" id="listView" aria-label="Tampilan daftar" title="Daftar" aria-pressed="true"><span data-icon="list"></span></button><button class="icon-button" id="gridView" aria-label="Tampilan ikon" title="Ikon" aria-pressed="false"><span data-icon="grid"></span></button></div><select id="density" aria-label="Ukuran tampilan"><option value="comfortable">Nyaman</option><option value="compact">Ringkas</option></select></div>
      {{UPLOAD_SECTION}}
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Nama</th><th>Jenis</th><th class="size">Ukuran</th><th class="hide-mobile">Terakhir diubah</th><th class="actions">Tindakan</th></tr>
          </thead>
          <tbody>{{ROWS}}</tbody>
        </table>
      </div>
      <p id="noResults" class="empty" hidden>Tidak ada file yang cocok.</p>
      <div class="statusbar"><span id="itemCount">{{ITEM_COUNT}}</span><span>WinTunnel</span></div>
    </section>
    <footer class="footer">Dibagikan melalui WinTunnel.</footer>
  </main>
</body>
</html>
